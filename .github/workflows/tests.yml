name: Core checks
on:
  push:
  pull_request:
jobs:
  tests:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: >-
          python scripts/bootstrap.py
          --source reg_voxelmorph_master --source reg_lapirn
          --source dynamic-network-architectures --source freesurfer_synthstrip
          --source denoise_redwgan --source DeepN4 --source deepNormalize
          --source HarmonizingFlows --source reg_ernet --source FastSurfer
          --source nobrainer --source FBNETGEN --source BrainNetworkTransformer
      - run: python -m unittest discover -s tests -v
      - run: node --check web/dashboard.js && node --check web/editor.js && node --check web/assistant.js && node --check web/settings.js && node --check web/connection.js && node --check web/data.js && node --check web/objective.js && node --check web/cycle.js
      - run: node --test tests/frontend.test.cjs
      - run: python scripts/build_frontend.py

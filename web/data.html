<section id="dataPanel" class="panel data-panel" aria-label="Data workspace">
  <div class="panel-head"><h2>Dataset</h2><span id="dataBadge" class="connection-pill">○ Not checked</span></div>
  <div id="selectedDataset" class="selected-dataset">○ Using configured sample data</div>
  <p id="dataWarning" class="data-warning" hidden></p>
  <p class="data-intro">3D T1w · 96 × 96 × 96 · brain, tissue and AAL masks · binary target</p>
  <div class="data-actions"><button id="inspectData" class="secondary">⌕ Check data</button><button id="viewDataContract" class="text-button">Input requirements ↗</button></div>
  <details id="dataSetup" class="disclosure"><summary>Convert another dataset <span>Source folders and manifest</span></summary>
    <label class="data-field">Source folders<textarea id="dataSources" rows="2" placeholder="One backend folder per line" aria-label="Data source folders"></textarea></label>
    <label class="data-field">Conversion manifest<input id="dataManifest" type="text" placeholder="/datasets/cohort/manifest.json" aria-label="Data manifest path"></label>
    <div class="data-actions"><button id="buildData" class="secondary">Build dataset</button><button id="dataExample" class="text-button">Manifest example ↗</button></div>
  </details>
  <details class="disclosure data-question"><summary>Ask the data agent <span>Optional</span></summary>
    <form id="dataChatForm" class="data-chat-form"><div class="data-input-row"><textarea id="dataQuestion" rows="2" maxlength="4000" placeholder="Which targets are missing from my T1w dataset?" aria-label="Data question" required></textarea><button id="askData" class="primary" type="submit">Ask ↗</button></div><p class="settings-note">Only your question and aggregate checks go to the selected AI account.</p></form>
  </details>
  <div id="dataProgress" class="assistant-progress" role="status" aria-live="polite" hidden></div>
  <div id="dataResult"></div>
</section>
